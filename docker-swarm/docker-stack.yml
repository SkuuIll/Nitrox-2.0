version: '3.8'

services:
  nitrox-server:
    image: nitrox/server:latest
    ports:
      - "11000:11000/udp"
    environment:
      - NITROX_SERVER_NAME=Docker Swarm Nitrox Server
      - NITROX_SERVER_PORT=11000
      - NITROX_ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - NITROX_SERVER_PASSWORD_FILE=/run/secrets/server_password
      - NITROX_GAME_MODE=Survival
      - NITROX_MAX_PLAYERS=100
      - NITROX_ENABLE_STEAM_DOWNLOAD=true
      - STEAM_USERNAME_FILE=/run/secrets/steam_username
      - STEAM_PASSWORD_FILE=/run/secrets/steam_password
      - NITROX_GAME_FILES_PATH=/app/gamefiles
      - NITROX_SAVE_DATA_PATH=/app/saves
      - NITROX_CONFIG_PATH=/app/config
    volumes:
      - gamefiles:/app/gamefiles
      - saves:/app/saves
      - config:/app/config
      - logs:/app/logs
    secrets:
      - admin_password
      - server_password
      - steam_username
      - steam_password
    networks:
      - nitrox-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        delay: 30s
        monitor: 60s
    healthcheck:
      test: ["/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  gamefiles:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/nitrox/gamefiles
  saves:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/nitrox/saves
  config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/nitrox/config
  logs:
    driver: local

networks:
  nitrox-network:
    driver: overlay
    attachable: true

secrets:
  admin_password:
    external: true
  server_password:
    external: true
  steam_username:
    external: true
  steam_password:
    external: true