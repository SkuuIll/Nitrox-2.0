apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nitrox-gamefiles-pvc
  labels:
    app: nitrox-server
    component: gamefiles
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd  # Adjust based on your cluster's storage classes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nitrox-saves-pvc
  labels:
    app: nitrox-server
    component: saves
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nitrox-config-pvc
  labels:
    app: nitrox-server
    component: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard