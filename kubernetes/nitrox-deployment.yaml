apiVersion: apps/v1
kind: Deployment
metadata:
  name: nitrox-server
  labels:
    app: nitrox-server
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nitrox-server
  template:
    metadata:
      labels:
        app: nitrox-server
        version: v1
    spec:
      containers:
      - name: nitrox-server
        image: nitrox/server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 11000
          protocol: UDP
          name: game-port
        env:
        - name: NITROX_SERVER_NAME
          valueFrom:
            configMapKeyRef:
              name: nitrox-config
              key: server-name
        - name: NITROX_SERVER_PORT
          value: "11000"
        - name: NITROX_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nitrox-secrets
              key: admin-password
        - name: NITROX_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nitrox-secrets
              key: server-password
              optional: true
        - name: NITROX_GAME_MODE
          valueFrom:
            configMapKeyRef:
              name: nitrox-config
              key: game-mode
        - name: NITROX_MAX_PLAYERS
          valueFrom:
            configMapKeyRef:
              name: nitrox-config
              key: max-players
        - name: NITROX_ENABLE_STEAM_DOWNLOAD
          value: "true"
        - name: STEAM_USERNAME
          valueFrom:
            secretKeyRef:
              name: steam-credentials
              key: username
        - name: STEAM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: steam-credentials
              key: password
        - name: NITROX_GAME_FILES_PATH
          value: "/app/gamefiles"
        - name: NITROX_SAVE_DATA_PATH
          value: "/app/saves"
        - name: NITROX_CONFIG_PATH
          value: "/app/config"
        volumeMounts:
        - name: game-files
          mountPath: /app/gamefiles
        - name: save-data
          mountPath: /app/saves
        - name: config-data
          mountPath: /app/config
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /app/healthcheck.sh
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /app/healthcheck.sh
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - "pkill -TERM dotnet && sleep 10"
      volumes:
      - name: game-files
        persistentVolumeClaim:
          claimName: nitrox-gamefiles-pvc
      - name: save-data
        persistentVolumeClaim:
          claimName: nitrox-saves-pvc
      - name: config-data
        persistentVolumeClaim:
          claimName: nitrox-config-pvc
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: nitrox-server-service
  labels:
    app: nitrox-server
spec:
  type: LoadBalancer
  ports:
  - port: 11000
    targetPort: 11000
    protocol: UDP
    name: game-port
  selector:
    app: nitrox-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nitrox-config
data:
  server-name: "Kubernetes Nitrox Server"
  game-mode: "Survival"
  max-players: "100"
  save-interval: "300000"
  max-backups: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: nitrox-secrets
type: Opaque
stringData:
  admin-password: "secure_admin_password_123"
  server-password: ""  # Empty for public server
---
apiVersion: v1
kind: Secret
metadata:
  name: steam-credentials
type: Opaque
stringData:
  username: "your_steam_username"
  password: "your_steam_password"