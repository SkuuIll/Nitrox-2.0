version: '3.8'

services:
  nitrox-server:
    build: .
    image: nitrox/server:latest
    container_name: nitrox-server
    restart: unless-stopped
    
    ports:
      - "11000:11000/udp"
    
    environment:
      # Server Configuration
      - NITROX_SERVER_NAME=My Nitrox Server
      - NITROX_SERVER_PORT=11000
      - NITROX_SERVER_PASSWORD=
      - NITROX_ADMIN_PASSWORD=secure_admin_password_123
      - NITROX_GAME_MODE=Survival
      
      # Save Configuration
      - NITROX_DISABLE_AUTO_SAVE=false
      - NITROX_SAVE_INTERVAL=300000
      - NITROX_MAX_BACKUPS=10
      
      # Steam Configuration (Required for game file download)
      - NITROX_ENABLE_STEAM_DOWNLOAD=true
      - STEAM_USERNAME=your_steam_username
      - STEAM_PASSWORD=your_steam_password
      
      # Paths (usually don't need to change these)
      - NITROX_GAME_FILES_PATH=/app/gamefiles
      - NITROX_SAVE_DATA_PATH=/app/saves
      - NITROX_CONFIG_PATH=/app/config
    
    volumes:
      # Persistent game files (to avoid re-downloading)
      - nitrox_gamefiles:/app/gamefiles
      
      # Persistent save data
      - nitrox_saves:/app/saves
      
      # Persistent configuration
      - nitrox_config:/app/config
      
      # Logs (optional)
      - nitrox_logs:/app/logs
    
    healthcheck:
      test: ["/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    
    # Resource limits (adjust based on your VPS)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

volumes:
  nitrox_gamefiles:
    driver: local
  nitrox_saves:
    driver: local
  nitrox_config:
    driver: local
  nitrox_logs:
    driver: local

networks:
  default:
    name: nitrox-network